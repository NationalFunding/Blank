<template>

    <lightning-card class="slds-has-dividers_around-space" style="margin-right: 5px; margin-left: 5px;">

        <lightning-file-upload label="Attach File" name="fileUploader" accept={acceptedFormats} record-id={recordId}
            onuploadfinished={handleUploadFinished}>
        </lightning-file-upload>

        <br>

        <i>Please Note: You can only upload files one at a time.</i>

        <br>

        <lightning-button label="Get Files" title="Share Pre-existing Files" onclick={openShareFilesModal}
            class="slds-m-left_x-small"></lightning-button>

    </lightning-card>


    <!-- File Type -->
    <template if:true={typeModal}>

        <div class="contact-edit" data-id="contact-edit" style="height: 640px;">

            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <header class="slds-modal__header">

                        <!-- TITLE -->
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">
                            File Type
                        </h2>

                    </header>

                    <!-- BODY -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                        <p if:true={errorMessage} class="slds-align_absolute-center" style="color:red">{errorMessage}
                        </p>

                        <!-- Update File Type -->
                        <lightning-card>


                            <lightning-radio-group 
                                label =""
                                name ="file list"
                                onchange={handleChange}
                                options={options}
                                value={value}
                                type='radio'>
                            </lightning-radio-group>


                            <!-- <lightning-checkbox-group name="Checkbox Group" label="Checkbox Group" options={options}
                                value={value} onchange={handleChange} required></lightning-checkbox-group> -->

                        </lightning-card>
                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer">
                        <!-- Update/Save Button -->
                        <lightning-button label="Update" variant="brand" onclick={saveForm}>
                        </lightning-button>

                    </footer>

                </div>

            </section>
            <!-- Create Shading for Modal -->
            <div class="slds-backdrop slds-backdrop_open"></div>

        </div>

    </template>

    <!-- Available Contacts -->
    <template if:true={contactModal}>

        <div class="contact-edit" data-id="contact-edit" style="height: 640px;">

            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <header class="slds-modal__header">

                        <!-- TITLE -->
                        <h2 id="contacts-heading-01" class="slds-text-heading_medium slds-hyphenate">
                            Contacts
                        </h2>

                    </header>

                    <!-- BODY -->
                    <div class="slds-modal__content slds-p-around_medium" id="contacts-content-id-1">

                        <p if:true={errorMessage} class="slds-align_absolute-center" style="color:red">{errorMessage}
                        </p>

                        <!-- Update File Type -->
                        <lightning-card>


                            <lightning-radio-group 
                                label =""
                                name ="contact list"
                                onchange={handleChange}
                                options={contactList}
                                value={value}
                                type='radio'>
                            </lightning-radio-group>

                            <!-- <lightning-checkbox-group name="Checkbox Group" label="Checkbox Group" options={contactList}
                                value={value} onchange={handleChange} required></lightning-checkbox-group> -->

                        </lightning-card>
                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer">
                        <!-- Update/Save Button -->
                        <lightning-button label="Update" variant="brand" onclick={relateDocument}>
                        </lightning-button>

                    </footer>

                </div>

            </section>
            <!-- Create Shading for Modal -->
            <div class="slds-backdrop slds-backdrop_open"></div>

        </div>

    </template>

    <!-- Pre-Existing Files -->
    <template if:true={shareFilesModal}>

        <div class="contact-edit" data-id="share-files" style="height: 640px;">

            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <header class="slds-modal__header">

                        <!-- TITLE -->
                        <h2 id="share-files-heading-01" class="slds-text-heading_medium slds-hyphenate">
                            File Selection
                        </h2>

                    </header>

                    <!-- BODY -->
                    <div class="slds-modal__content slds-p-around_medium" id="share-files-content-id-1">

                        <p if:true={errorMessage} class="slds-align_absolute-center" style="color:red">{errorMessage}
                        </p>

                        <!-- Update File Type -->
                        <lightning-card>

                            <lightning-checkbox-group name="Checkbox Group" label="Relatable Files" options={fileList}
                                value={flvalue} onchange={flhandleChange} required></lightning-checkbox-group>

                        </lightning-card>

                        <br>

                        <i>This is a list of Files that are related to the Account or its Contacts and NOT related to this Opportunity</i>
                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" variant="neutral" onclick={closeShareFilesModal} style="margin-right: 10px;">
                        </lightning-button >
                        
                        <!-- Update/Save Button -->
                        <lightning-button label="Share" variant="brand" onclick={shareDocs}>
                        </lightning-button>

                    </footer>

                </div>

            </section>
            <!-- Create Shading for Modal -->
            <div class="slds-backdrop slds-backdrop_open"></div>

        </div>

    </template>


</template>
